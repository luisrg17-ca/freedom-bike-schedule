<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freedom Bike Schedule</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <img src="FB.png" alt="Freedom Bikes" class="brand-logo">

      <div class="brand-text">
        <h1>Freedom Bike Schedule</h1>
        <p>Team Schedule</p>
      </div>
    </div>

    <button id="adminBtn" class="admin-btn">Admin Login</button>
  </header>

  <main class="container">
    <section class="calendar-card">
      <div class="calendar-header">
        <button id="prevMonth" class="nav-btn">←</button>
        <h2 id="monthTitle">September 2026</h2>
        <button id="nextMonth" class="nav-btn">→</button>
      </div>

      <div class="weekdays">
        <div>Monday</div>
        <div>Tuesday</div>
        <div>Wednesday</div>
        <div>Thursday</div>
        <div>Friday</div>
        <div>Saturday</div>
        <div>Sunday</div>
      </div>

      <div id="calendarGrid" class="calendar-grid"></div>
    </section>
  </main>

  <!-- Admin Login Modal -->
  <div id="loginModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeLoginModal" class="modal-close">×</button>

      <h2>Admin Login</h2>
      <p class="modal-subtitle">
        Sign in to manage the Freedom Bike schedule.
      </p>

      <form id="loginForm">
        <label for="adminEmail">Email</label>
        <input
          type="email"
          id="adminEmail"
          value="admin@freedombike.local"
          required
        />

        <label for="adminPassword">Password</label>
        <input
          type="password"
          id="adminPassword"
          placeholder="Enter password"
          required
        />

        <p id="loginError" class="login-error"></p>

        <button type="submit" class="login-submit">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
